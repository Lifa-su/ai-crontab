<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Crontab - Cron表达式生成器与解释器</title>
<meta name="description" content="可视化Cron表达式生成器，支持自然语言解释和执行时间预览">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:2rem;margin:20px 0 8px;background:linear-gradient(135deg,#00d2ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;color:#888;margin-bottom:30px;font-size:.95rem}
.card{background:#16213e;border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid #0f3460}
.card-title{font-size:1.1rem;font-weight:600;margin-bottom:16px;color:#00d2ff;display:flex;align-items:center;gap:8px}
.cron-display{background:#0a0a1a;border:2px solid #7b2ff7;border-radius:10px;padding:20px;text-align:center;margin-bottom:20px;font-family:'Courier New',monospace;font-size:1.8rem;letter-spacing:6px;color:#00ff88;cursor:text;position:relative;transition:border-color .3s}
.cron-display:focus-within{border-color:#00d2ff}
#cronInput{background:transparent;border:none;color:#00ff88;font-family:inherit;font-size:inherit;letter-spacing:inherit;text-align:center;width:100%;outline:none}
#cronInput::placeholder{color:#335}
.cron-labels{display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:.75rem;color:#666}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.preset-btn{background:#0f3460;border:1px solid #1a4a8a;color:#ccc;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
.preset-btn:hover{background:#1a4a8a;color:#fff;transform:translateY(-1px)}
.preset-btn:active{transform:translateY(0)}
.field-group{margin-bottom:16px}
.field-label{font-size:.9rem;color:#aaa;margin-bottom:6px;font-weight:500}
.field-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field-type{display:flex;gap:4px;flex-shrink:0}
.type-btn{background:#0a0a1a;border:1px solid #333;color:#888;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .2s}
.type-btn.active{background:#7b2ff7;border-color:#7b2ff7;color:#fff}
.type-btn:hover{border-color:#7b2ff7}
.multi-select{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.ms-btn{background:#0a0a1a;border:1px solid #333;color:#888;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:.8rem;min-width:32px;text-align:center;transition:all .15s}
.ms-btn.active{background:#00d2ff;border-color:#00d2ff;color:#000;font-weight:600}
.ms-btn:hover{border-color:#00d2ff}
.range-inputs{display:flex;align-items:center;gap:6px}
.range-inputs input,.range-inputs select{background:#0a0a1a;border:1px solid #333;color:#e0e0e0;padding:4px 8px;border-radius:4px;width:60px;font-size:.85rem}
.range-inputs span{color:#666;font-size:.85rem}
.result-box{background:#0a0a1a;border-radius:8px;padding:16px;margin-top:12px}
.result-box.zh{border-left:3px solid #00d2ff}
.result-box.en{border-left:3px solid #7b2ff7}
.result-label{font-size:.75rem;color:#666;text-transform:uppercase;margin-bottom:4px}
.result-text{font-size:1rem;line-height:1.5}
.next-runs{list-style:none;padding:0}
.next-runs li{padding:8px 12px;border-bottom:1px solid #1a1a3e;display:flex;align-items:center;gap:10px;font-family:'Courier New',monospace;font-size:.9rem}
.next-runs li:last-child{border-bottom:none}
.run-index{background:#7b2ff7;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.run-relative{color:#666;font-size:.8rem;margin-left:auto}
footer{text-align:center;padding:30px 0 20px;color:#444;font-size:.8rem}
footer a{color:#7b2ff7;text-decoration:none}
@media(max-width:600px){
  h1{font-size:1.5rem}
  .cron-display{font-size:1.3rem;letter-spacing:3px;padding:14px}
  .card{padding:16px}
  .container{padding:12px}
  .cron-labels{gap:10px;font-size:.65rem}
  .preset-btn{padding:6px 12px;font-size:.8rem}
}
</style>
</head>
<body>
<div class="container">
  <h1>⏰ AI Crontab</h1>
  <p class="subtitle">Cron表达式生成器与解释器 / Cron Expression Generator & Interpreter</p>

  <div class="cron-display">
    <input type="text" id="cronInput" value="* * * * *" placeholder="* * * * *" spellcheck="false" autocomplete="off">
    <div class="cron-labels"><span>分钟</span><span>小时</span><span>日</span><span>月</span><span>星期</span></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 常用预设 Presets</div>
    <div class="presets">
      <button class="preset-btn" data-cron="* * * * *">每分钟</button>
      <button class="preset-btn" data-cron="0 * * * *">每小时</button>
      <button class="preset-btn" data-cron="0 0 * * *">每天午夜</button>
      <button class="preset-btn" data-cron="0 0 * * 0">每周日</button>
      <button class="preset-btn" data-cron="0 0 1 * *">每月1号</button>
      <button class="preset-btn" data-cron="*/5 * * * *">每5分钟</button>
      <button class="preset-btn" data-cron="0 9 * * 1-5">工作日9点</button>
      <button class="preset-btn" data-cron="0 0 1 1 *">每年1月1日</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎛️ 可视化选择 Visual Builder</div>
    <div id="visualBuilder"></div>
  </div>

  <div class="card">
    <div class="card-title">💬 自然语言解释 Explanation</div>
    <div class="result-box zh">
      <div class="result-label">中文</div>
      <div class="result-text" id="explainZh">每分钟执行一次</div>
    </div>
    <div class="result-box en" style="margin-top:10px">
      <div class="result-label">English</div>
      <div class="result-text" id="explainEn">Runs every minute</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📅 下次执行时间 Next 5 Runs</div>
    <div class="result-box">
      <ol class="next-runs" id="nextRuns"></ol>
    </div>
  </div>
</div>

<footer>
  <p>AI Crontab — Built with ❤️ | <a href="https://github.com/Lifa-su/ai-crontab" target="_blank">GitHub</a></p>
</footer>

<script>
(function(){
'use strict';

const FIELDS = [
  {name:'minute',label:'分钟 Minute',min:0,max:59,shortList:null},
  {name:'hour',label:'小时 Hour',min:0,max:23,shortList:null},
  {name:'day',label:'日 Day',min:1,max:31,shortList:null},
  {name:'month',label:'月 Month',min:1,max:12,shortList:['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']},
  {name:'weekday',label:'星期 Weekday',min:0,max:6,shortList:['日','一','二','三','四','五','六']}
];

const MONTH_NAMES_ZH = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const MONTH_NAMES_EN = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAY_ZH = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const WEEKDAY_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let fieldStates = [
  {type:'every',values:[],step:1,rangeStart:0,rangeEnd:59},
  {type:'every',values:[],step:1,rangeStart:0,rangeEnd:23},
  {type:'every',values:[],step:1,rangeStart:1,rangeEnd:31},
  {type:'every',values:[],step:1,rangeStart:1,rangeEnd:12},
  {type:'every',values:[],step:1,rangeStart:0,rangeEnd:6}
];

let updating = false;

function init(){
  buildVisual();
  document.querySelectorAll('.preset-btn').forEach(b=>{
    b.addEventListener('click',()=>setCron(b.dataset.cron));
  });
  document.getElementById('cronInput').addEventListener('input',function(){
    if(!updating) parseCronToState(this.value.trim());
  });
  updateAll();
}

function buildVisual(){
  const container = document.getElementById('visualBuilder');
  container.innerHTML = '';
  FIELDS.forEach((f,i)=>{
    const div = document.createElement('div');
    div.className = 'field-group';
    div.innerHTML = `<div class="field-label">${f.label}</div><div class="field-row">
      <div class="field-type">
        <button class="type-btn${fieldStates[i].type==='every'?' active':''}" data-fi="${i}" data-t="every">每个</button>
        <button class="type-btn${fieldStates[i].type==='specific'?' active':''}" data-fi="${i}" data-t="specific">指定</button>
        <button class="type-btn${fieldStates[i].type==='range'?' active':''}" data-fi="${i}" data-t="range">范围</button>
        <button class="type-btn${fieldStates[i].type==='step'?' active':''}" data-fi="${i}" data-t="step">间隔</button>
      </div>
      <div class="field-options" id="fo${i}"></div>
    </div>`;
    container.appendChild(div);
    div.querySelectorAll('.type-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        fieldStates[i].type = b.dataset.t;
        if(b.dataset.t==='specific' && fieldStates[i].values.length===0) fieldStates[i].values=[f.min];
        buildFieldOptions(i);
        updateAll();
      });
    });
    buildFieldOptions(i);
  });
}

function buildFieldOptions(i){
  const f = FIELDS[i], s = fieldStates[i], el = document.getElementById('fo'+i);
  const parent = el.closest('.field-row');
  parent.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===s.type));
  el.innerHTML = '';
  if(s.type==='every'){
    el.innerHTML='<span style="color:#00ff88;font-size:.85rem">* (全部)</span>';
  } else if(s.type==='specific'){
    const wrap = document.createElement('div');
    wrap.className='multi-select';
    for(let v=f.min;v<=f.max;v++){
      const btn = document.createElement('button');
      btn.className='ms-btn'+(s.values.includes(v)?' active':'');
      btn.textContent = f.shortList ? (f.name==='weekday'?f.shortList[v]:f.shortList[v]) : v;
      btn.addEventListener('click',()=>{
        const idx=s.values.indexOf(v);
        if(idx>-1) s.values.splice(idx,1); else s.values.push(v);
        s.values.sort((a,b)=>a-b);
        btn.classList.toggle('active');
        updateAll();
      });
      wrap.appendChild(btn);
    }
    el.appendChild(wrap);
  } else if(s.type==='range'){
    el.innerHTML=`<div class="range-inputs">
      <input type="number" min="${f.min}" max="${f.max}" value="${s.rangeStart}" id="rs${i}">
      <span>到</span>
      <input type="number" min="${f.min}" max="${f.max}" value="${s.rangeEnd}" id="re${i}">
    </div>`;
    el.querySelector('#rs'+i).addEventListener('change',function(){s.rangeStart=+this.value;updateAll();});
    el.querySelector('#re'+i).addEventListener('change',function(){s.rangeEnd=+this.value;updateAll();});
  } else if(s.type==='step'){
    el.innerHTML=`<div class="range-inputs">
      <span>每</span>
      <input type="number" min="1" max="${f.max-f.min+1}" value="${s.step}" id="ss${i}">
      <span>${f.name==='minute'?'分钟':f.name==='hour'?'小时':f.name==='day'?'天':f.name==='month'?'月':'天'}</span>
    </div>`;
    el.querySelector('#ss'+i).addEventListener('change',function(){s.step=Math.max(1,+this.value);updateAll();});
  }
}

function stateToField(i){
  const s=fieldStates[i],f=FIELDS[i];
  if(s.type==='every') return '*';
  if(s.type==='specific'){
    if(s.values.length===0) return '*';
    return s.values.join(',');
  }
  if(s.type==='range') return s.rangeStart+'-'+s.rangeEnd;
  if(s.type==='step') return '*/'+s.step;
  return '*';
}

function stateToCron(){
  return FIELDS.map((_,i)=>stateToField(i)).join(' ');
}

function setCron(expr){
  document.getElementById('cronInput').value=expr;
  parseCronToState(expr);
}

function parseCronToState(expr){
  const parts=expr.split(/\s+/);
  if(parts.length<5) return;
  for(let i=0;i<5;i++){
    const p=parts[i],f=FIELDS[i],s=fieldStates[i];
    if(p==='*'){s.type='every';s.values=[];}
    else if(p.includes('/')){
      s.type='step';
      const sp=p.split('/');
      s.step=parseInt(sp[1])||1;
    } else if(p.includes('-') && !p.includes(',')){
      s.type='range';
      const rp=p.split('-');
      s.rangeStart=parseInt(rp[0])||f.min;
      s.rangeEnd=parseInt(rp[1])||f.max;
    } else if(p.includes(',')||/^\d+$/.test(p)){
      s.type='specific';
      s.values=p.split(',').map(Number).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
    } else {
      s.type='every';
    }
  }
  buildVisual();
  updateAll();
}

function updateAll(){
  updating=true;
  const cron=stateToCron();
  document.getElementById('cronInput').value=cron;
  const parts=cron.split(/\s+/);
  document.getElementById('explainZh').textContent=explainCronZh(parts);
  document.getElementById('explainEn').textContent=explainCronEn(parts);
  showNextRuns(parts);
  updating=false;
}

function parseField(str,min,max){
  if(str==='*') return null;
  const vals=new Set();
  str.split(',').forEach(part=>{
    if(part.includes('/')){
      const [range,stepStr]=part.split('/');
      const step=parseInt(stepStr)||1;
      let start=min,end=max;
      if(range!=='*'){
        if(range.includes('-')){const[a,b]=range.split('-');start=parseInt(a);end=parseInt(b);}
        else start=parseInt(range);
      }
      for(let v=start;v<=end;v+=step) vals.add(v);
    } else if(part.includes('-')){
      const[a,b]=part.split('-');
      for(let v=parseInt(a);v<=parseInt(b);v++) vals.add(v);
    } else {
      vals.add(parseInt(part));
    }
  });
  return [...vals].sort((a,b)=>a-b);
}

function explainCronZh(p){
  if(p.length<5) return '无效的Cron表达式';
  const[mi,ho,da,mo,wd]=p;
  let parts=[];
  if(mo!=='*'){
    const mv=parseField(mo,1,12);
    parts.push(mv.map(v=>MONTH_NAMES_ZH[v]).join('、'));
  }
  if(wd!=='*'){
    const wv=parseField(wd,0,6);
    parts.push(wv.map(v=>WEEKDAY_ZH[v]).join('、'));
  }
  if(da!=='*'){
    if(da.includes('/')){parts.push('每隔'+da.split('/')[1]+'天');}
    else if(da.includes('-')){const[a,b]=da.split('-');parts.push(a+'号到'+b+'号');}
    else parts.push(da.split(',').map(v=>v+'号').join('、'));
  }
  if(ho!=='*'){
    if(ho.includes('/')){parts.push('每隔'+ho.split('/')[1]+'小时');}
    else if(ho.includes('-')){const[a,b]=ho.split('-');parts.push(a+'点到'+b+'点');}
    else parts.push(ho.split(',').map(v=>v+'点').join('、'));
  } else if(mi!=='*'){
    parts.push('每小时');
  }
  if(mi!=='*'){
    if(mi.includes('/')){parts.push('每隔'+mi.split('/')[1]+'分钟');}
    else if(mi.includes('-')){const[a,b]=mi.split('-');parts.push('第'+a+'到'+b+'分钟');}
    else if(mi==='0'){if(ho==='*') parts.push('整点');}
    else parts.push('第'+mi.split(',').join('、')+'分钟');
  }
  if(mi==='*'&&ho==='*'&&da==='*'&&mo==='*'&&wd==='*') return '每分钟执行一次';
  if(parts.length===0) return '每分钟执行一次';
  return parts.join('，')+'执行';
}

function explainCronEn(p){
  if(p.length<5) return 'Invalid cron expression';
  const[mi,ho,da,mo,wd]=p;
  if(mi==='*'&&ho==='*'&&da==='*'&&mo==='*'&&wd==='*') return 'Runs every minute';
  let parts=[];
  if(mi==='*') parts.push('Every minute');
  else if(mi.includes('/')) parts.push('Every '+mi.split('/')[1]+' minutes');
  else if(mi==='0') parts.push('At minute 0');
  else parts.push('At minute '+mi);

  if(ho==='*'){if(mi!=='*') parts.push('of every hour');}
  else if(ho.includes('/')) parts.push('every '+ho.split('/')[1]+' hours');
  else parts.push('at '+ho.split(',').map(v=>v+':00').join(', '));

  if(da!=='*'){
    if(da.includes('/')) parts.push('every '+da.split('/')[1]+' days');
    else parts.push('on day '+da+' of the month');
  }
  if(mo!=='*'){
    const mv=parseField(mo,1,12);
    parts.push('in '+mv.map(v=>MONTH_NAMES_EN[v]).join(', '));
  }
  if(wd!=='*'){
    const wv=parseField(wd,0,6);
    parts.push('on '+wv.map(v=>WEEKDAY_EN[v]).join(', '));
  }
  return parts.join(' ');
}

function getNextRuns(parts,count){
  if(parts.length<5) return [];
  const minutes=parseField(parts[0],0,59);
  const hours=parseField(parts[1],0,23);
  const days=parseField(parts[2],1,31);
  const months=parseField(parts[3],1,12);
  const weekdays=parseField(parts[4],0,6);
  const results=[];
  const now=new Date();
  let d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours(),now.getMinutes()+1,0,0);
  const maxIter=525600;
  for(let iter=0;iter<maxIter&&results.length<count;iter++){
    const mon=d.getMonth()+1,day=d.getDate(),wd=d.getDay(),hr=d.getHours(),mn=d.getMinutes();
    if(months&&!months.includes(mon)){d.setMonth(d.getMonth()+1);d.setDate(1);d.setHours(0);d.setMinutes(0);continue;}
    const dayMatch=days?days.includes(day):true;
    const wdMatch=weekdays?weekdays.includes(wd):true;
    if(days&&weekdays){if(!dayMatch&&!wdMatch){d.setDate(d.getDate()+1);d.setHours(0);d.setMinutes(0);continue;}}
    else if(days&&!dayMatch){d.setDate(d.getDate()+1);d.setHours(0);d.setMinutes(0);continue;}
    else if(weekdays&&!wdMatch){d.setDate(d.getDate()+1);d.setHours(0);d.setMinutes(0);continue;}
    if(hours&&!hours.includes(hr)){d.setHours(d.getHours()+1);d.setMinutes(0);continue;}
    if(minutes&&!minutes.includes(mn)){d.setMinutes(d.getMinutes()+1);continue;}
    results.push(new Date(d));
    d.setMinutes(d.getMinutes()+1);
  }
  return results;
}

function formatDate(d){
  const pad=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+WEEKDAY_ZH[d.getDay()];
}

function relativeTime(d){
  const diff=d-new Date();
  const mins=Math.floor(diff/60000);
  if(mins<60) return mins+'分钟后';
  const hrs=Math.floor(mins/60);
  if(hrs<24) return hrs+'小时'+((mins%60)>0?(mins%60)+'分钟':'')+'后';
  const days=Math.floor(hrs/24);
  return days+'天后';
}

function showNextRuns(parts){
  const runs=getNextRuns(parts,5);
  const el=document.getElementById('nextRuns');
  if(runs.length===0){el.innerHTML='<li style="color:#666">无法计算执行时间</li>';return;}
  el.innerHTML=runs.map((r,i)=>`<li><span class="run-index">${i+1}</span><span>${formatDate(r)}</span><span class="run-relative">${relativeTime(r)}</span></li>`).join('');
}

init();
})();
</script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="130747" async data-cfasync="false"></script>
</body>
</html>
